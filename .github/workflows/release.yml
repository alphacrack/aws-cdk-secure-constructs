name: Release

# Tagging a version (push of a `v*` tag) verifies the build and creates a
# GitHub Release. It deliberately does NOT publish to npm.
#
# Publishing to npm is a separate, explicit action: run this workflow manually
# (Actions -> Release -> Run workflow) with `publish_npm: true`. That keeps npm
# releases intentional rather than an automatic side effect of tagging, and
# lets a repo environment gate them behind a required approval.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish the current ref to npm'
        type: boolean
        default: false

permissions:
  contents: read

env:
  JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: '1'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci
      - name: Build (jsii)
        run: npm run build

  github-release:
    name: GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            npm install aws-cdk-secure-constructs@${{ github.ref_name }}
            ```

            See the [README](./README.md) and [CHANGELOG](./CHANGELOG.md) for details.

  npm-publish:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings to gate publishes.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Build (jsii)
        run: npm run build
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
